services:
  - type: web
    name: icai-diary-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: IcaiDiary@Admin2025
      - key: DOWNLOAD_URL
        value: https://github.com/nakum-vishvarajsinh/icai-diary/releases/latest
    disk:
      name: icai-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
